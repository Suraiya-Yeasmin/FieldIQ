<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FieldIQ — Crop Rotation Intelligence</title>
<style>
:root{--bg:#f3f5f1;--card:#fff;--ink:#12233a;--mut:#5b6b7d;--line:#dde3da;--nav:#0b1f3a;--acc:#2f7d4f;--warn:#c47f17;--bad:#b23b3b;--chip:#eef3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1520;--card:#15202e;--ink:#e8eef5;--mut:#9fb0c2;--line:#26364a;--nav:#07111f;--chip:#1c2b3c}}
:root[data-theme="dark"]{--bg:#0d1520;--card:#15202e;--ink:#e8eef5;--mut:#9fb0c2;--line:#26364a;--nav:#07111f;--chip:#1c2b3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:linear-gradient(135deg,var(--nav),#16406b);color:#fff;padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px;letter-spacing:.5px}header small{opacity:.75;display:block}
.badge{background:#f5b942;color:#3a2600;font-weight:700;font-size:11px;padding:3px 8px;border-radius:99px}
button,select,input{font:inherit;color:inherit}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:8px 20px;background:var(--card);border-bottom:1px solid var(--line)}
nav button{border:0;background:none;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--mut)}
nav button.on{background:var(--nav);color:#fff}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 6px;font-size:14px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.big{font-size:26px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.chip{display:inline-block;background:var(--chip);border-radius:99px;padding:2px 10px;font-size:12px;margin:2px 4px 2px 0}
.pos{color:var(--acc)}.neg{color:var(--bad)}.neu{color:var(--warn)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--chip);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
select,input[type=text]{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.hero{background:linear-gradient(135deg,#0b1f3a,#1b5a52);color:#fff;border-radius:18px;padding:36px 28px;margin-bottom:16px}
.hero h2{font-size:30px;margin:0 0 8px}.sec{margin:22px 0 8px;font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.scroll{overflow-x:auto}.risk{border-left:4px solid var(--warn);padding-left:10px;margin:8px 0}
.chat{max-height:300px;overflow:auto;margin:8px 0}.msg{margin:6px 0;padding:8px 10px;border-radius:10px;background:var(--chip)}.msg.u{background:var(--acc);color:#fff;margin-left:20%}
.disc{font-size:12px;color:var(--mut);border-top:1px solid var(--line);margin-top:24px;padding-top:10px}
svg text{fill:var(--mut);font-size:11px}
.banner{position:relative;overflow:hidden;border-radius:18px;color:#fff;background:#0b1f3a}
.banner svg{position:absolute;inset:0;width:100%;height:100%}
.banner .ov{position:relative;z-index:1;min-height:inherit;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:28px;background:linear-gradient(90deg,rgba(8,24,44,.84),rgba(8,24,44,.15) 78%)}

.shell{display:flex;align-items:flex-start}
nav{flex-direction:column;flex-wrap:nowrap;width:215px;flex:none;position:sticky;top:0;min-height:calc(100vh - 70px);border-right:1px solid var(--line);border-bottom:0;padding:12px}
nav button{text-align:left}
main{flex:1;min-width:0;max-width:none;margin:0}
.cal{display:grid;grid-template-columns:120px repeat(12,1fr);gap:2px;font-size:12px}.cal div{padding:4px;border-radius:4px;text-align:center}.cal .on{background:var(--acc);color:#fff}.cal .off{background:var(--chip)}
@media(max-width:800px){.shell{display:block}nav{width:auto;flex-direction:row;overflow-x:auto;min-height:0;position:static;padding:8px}nav button{white-space:nowrap}}
@media print{header,nav,.noprint,.banner{display:none!important}}
#login{position:fixed;inset:0;z-index:50;display:grid;grid-template-columns:1.1fr 1fr;overflow:auto;background:#0b1f3a}
.lg-art{position:relative;color:#fff;min-height:260px}.lg-art svg{position:absolute;inset:0;width:100%;height:100%}.lg-art .ov{position:relative;z-index:1;padding:36px;min-height:100%;background:linear-gradient(180deg,rgba(8,24,44,.75),rgba(8,24,44,.1) 70%)}
.lg-card{background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:36px}
@media(max-width:800px){#login{grid-template-columns:1fr}}
.tile{cursor:pointer;text-align:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card)}.tile.on{outline:2px solid var(--acc)}.tile span{font-size:30px;display:block}
.alert{border-left:4px solid var(--warn);background:var(--chip);padding:10px 12px;border-radius:8px;margin:8px 0}

#login{display:block;background:#0f3d2e;grid-template-columns:none}
.lx{min-height:100%;display:grid;grid-template-columns:1.25fr 1fr;position:relative;color:#fff}
.lx-left{position:relative;min-height:640px;overflow:hidden;padding:34px 40px;display:flex;flex-direction:column}

Rice:{w:3,fam:"Poaceae",leg:0,n:"Cereal; high water demand"},Wheat:{w:2,fam:"Poaceae",leg:0,n:"Cereal; moderate water, cool season"},

/* ===== Analytics ===== */
function analyze(){const p=avg(D.precip)/avg(D.base)-1,s=avg(D.sm.slice(-3))-avg(D.smBase.slice(-3)),v=D.ndvi-D.ndviBase;
const R=[];if(p<-.05)R.push(["Drought-related concern","Moderate","Precipitation "+(p*100).toFixed(0)+"% vs baseline; soil moisture below baseline","May–Oct","Consider water-conserving rotation options."]);
if(s<-.02)R.push(["Soil moisture deficiency","Moderate","Recent soil moisture "+Math.abs(s*100).toFixed(1)+" pts below baseline (m³/m³ ×100)","Aug–Oct","Check field moisture before planting."]);
if(v<-.05)R.push(["Vegetation stress (indicator)","Low–Moderate","NDVI "+D.ndvi+" vs baseline "+D.ndviBase,"Latest composite","Satellite indicators suggest reduced vegetation activity. Field inspection is recommended to determine the cause."]);
R.push(["Heat stress","Low","Mean temp ≈ "+avg(D.temp).toFixed(1)+"°C; no extreme signal in sample series","May–Oct","Monitor during hot spells."]);
return{p,s,v,R,dry:p<-.05||s<-.02}}
/* ===== Rotation engine: transparent rules; each factor returns +1/0/-1 with a stated reason ===== */
function engine(){const A=analyze(),cur=CROPS[S.crop],out=[];
const wt={"Water conservation":"water","Soil health":"soil","Climate resilience":"clim","Lower input requirement":"input","Crop diversity":"div","Risk reduction":"clim"}[S.prio];
for(const [n,c] of Object.entries(CROPS)){if(n===S.crop||n===S.prev&&c.fam===cur.fam&&0)continue;if(n==="Rice")continue;
const F=[];const dryPen=(A.dry&&S.irr!=="Available")||S.irr==="None";
F.push(["water",c.w<cur.w?1:c.w>cur.w?-1:0,c.w<cur.w?"Lower water requirement than "+S.crop:c.w>cur.w?"Higher water requirement":"Similar water requirement"]);
if(dryPen&&c.w>=2)F.push(["water",-1,"Recent dry indicators + limited irrigation make a moderate/high-water crop less suitable"]);
F.push(["soil",c.leg?1:0,c.leg?"Legume inclusion may benefit soil nitrogen":"No nitrogen-fixing benefit"]);
const same=c.fam===cur.fam||c.fam===CROPS[S.prev]?.fam&&S.prev!==S.crop&&0;
F.push(["div",c.fam!==cur.fam?1:-1,c.fam!==cur.fam?"Different crop family from "+S.crop+" (breaks pest/disease cycles)":"Same family as "+S.crop]);
F.push(["clim",A.dry?(c.w===1?1:-1):0,A.dry?(c.w===1?"Low-water crop suits drier-than-baseline conditions":"Water-demanding under drier conditions"):"No strong climate signal"]);
F.push(["input",c.leg||c.w===1?1:c.n.includes("heavy")?-1:0,c.leg||c.w===1?"Generally lower input needs":c.n.includes("heavy")?"Heavy nutrient feeder":"Typical input needs"]);
if(S.risk==="Low"&&n==="Vegetables")F.push(["clim",-1,"Higher management/market variability for low risk tolerance"]);
const pts=F.reduce((a,f)=>a+f[1]*(f[0]===wt?2:1),0);out.push({next:n,seq:[S.crop,n,S.crop],F,pts,c})}
out.sort((a,b)=>b.pts-a.pts);const top=out.slice(0,4);top.forEach((s,i)=>s.id="ABCD"[i]);return top}

function fieldAt(x,y){return FL.find(f=>x>=f.r[0]&&x<f.r[0]+f.r[2]&&y>=f.r[1]&&y<f.r[1]+f.r[3])}
function cell(x,y){const u=x/15,v=y/9,f=fieldAt(x,y);
let nd=.36+.11*Math.sin(u*5+v*2)+.12*Math.cos(v*4+u),sm=.19+.16*v+.02*Math.sin(u*6),pr=88+14*Math.sin(u*3+1)+10*v,tp=30.2-1.6*v+.6*Math.sin(u*4);
